name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        # Устанавливаем xvfb и необходимые библиотеки для X11
        sudo apt-get install -y xvfb libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxrandr-dev libssl-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run tests with pytest
      env:
        PYTHONPATH: .
      run: |
        # --auto-servernum помогает избежать конфликтов номеров дисплеев
        xvfb-run --auto-servernum pytest